<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>遠行時光・旅途分帳與公費小幫手</title>

  <!-- Firebase 相容版本 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* ==========================================
       四季色彩與聯動配置 (Theme Token System)
       預設：秋天「溫暖燕麥焦糖調」
       ========================================== */
    :root, [data-theme="autumn"] {
      --bg-warm: #FAF8F5;
      --card-bg: #FFFFFF;
      --text-main: #3D352F;
      --text-muted: #827870;
      --text-light: #B0A7A0;
      
      --theme-dark: #6E4F3B;
      --theme-main: #8C6751;
      --theme-soft: #A67C5E;
      --theme-light: #F4ECE6;
      --warm-border: #EFE6DF;
      --border-soft: #F0ECE8;
      
      --rose-subtle: #BD6060;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      
      /* 極簡寫意手寫湖山：秋天四季調色 */
      --art-stroke: #8C6751;
      --art-mountain-fill: #EFE6DF;
      --art-sun: #C49767;
      --art-ink-blur: #EFE6DF;
    }

    /* 春天「初融櫻桃粉調」 */
    [data-theme="spring"] {
      --bg-warm: #FAF6F5;
      --theme-dark: #7A4242;
      --theme-main: #9E6161;
      --theme-soft: #B87C7C;
      --theme-light: #F8ECEC;
      --warm-border: #EEDCDC;
      --border-soft: #F2EBEB;
      --rose-subtle: #BD6060;
      
      /* 極簡寫意手寫湖山：春天四季調色 */
      --art-stroke: #9E6161;
      --art-mountain-fill: #F4EAE9;
      --art-sun: #D99B9B;
      --art-ink-blur: #F4EAE9;
    }

    /* 夏天「茂密森活綠調」 */
    [data-theme="summer"] {
      --bg-warm: #F6F8F6;
      --theme-dark: #375243;
      --theme-main: #4F6E5C;
      --theme-soft: #6A8D77;
      --theme-light: #EBF2ED;
      --warm-border: #D8E5DC;
      --border-soft: #E5EDE7;
      --rose-subtle: #BD6060;
      
      /* 極簡寫意手寫湖山：夏天四季調色 */
      --art-stroke: #4F6E5C;
      --art-mountain-fill: #E7EFEA;
      --art-sun: #88B29A;
      --art-ink-blur: #E7EFEA;
    }

    /* 冬天「靜謐雪霽藍調」 */
    [data-theme="winter"] {
      --bg-warm: #F5F7F9;
      --theme-dark: #38535F;
      --theme-main: #4D6D7A;
      --theme-soft: #688C9B;
      --theme-light: #E9F0F4;
      --warm-border: #D6E3EA;
      --border-soft: #E2EBF0;
      --rose-subtle: #BD6060;
      
      /* 極簡寫意手寫湖山：冬天四季調色 */
      --art-stroke: #4D6D7A;
      --art-mountain-fill: #E8EFF3;
      --art-sun: #96B4C2;
      --art-ink-blur: #E8EFF3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-warm);
      color: var(--text-main);
      padding-bottom: 96px;
      -webkit-tap-highlight-color: transparent;
      line-height: 1.6;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* 頂部導航 */
    .header {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-soft);
      padding: 13px 18px;
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .brand-leaf {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--theme-soft);
      transition: background-color 0.4s ease;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-main);
    }
    .role-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.4s ease;
    }
    .role-admin {
      background: var(--theme-light);
      color: var(--theme-dark);
      border: 1px solid var(--warm-border);
    }
    .role-viewer {
      background: #F4F1EE;
      color: var(--text-muted);
      border: 1px solid var(--border-soft);
    }

    /* 季節切換點點 */
    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .theme-dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }
    .dot:hover {
      transform: scale(1.2);
    }
    .dot.spring { background-color: #C88A8A; }
    .dot.summer { background-color: #7D9D8B; }
    .dot.autumn { background-color: #C49767; }
    .dot.winter { background-color: #829DA7; }

    [data-theme="spring"] .dot.spring { border-color: #5E2A2A; transform: scale(1.1); }
    [data-theme="summer"] .dot.summer { border-color: #2F4238; transform: scale(1.1); }
    [data-theme="autumn"] .dot.autumn { border-color: #4D3321; transform: scale(1.1); }
    [data-theme="winter"] .dot.winter { border-color: #2B3B42; transform: scale(1.1); }

    .btn-header-link {
      font-size: 12px;
      color: var(--theme-dark);
      background: var(--theme-light);
      border: 1px solid var(--warm-border);
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
    }
    .btn-header-link:hover {
      background: var(--warm-border);
    }
    .btn-reset-all {
      font-size: 11px;
      color: var(--text-light);
      background: none;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s;
    }
    .btn-reset-all:hover {
      color: var(--rose-subtle);
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    /* ==========================================
       極簡湖山與「遠行與日常」交融設計區塊 (不封口 fading 設計)
       ========================================== */
    .lake-scene-container {
      position: relative;
      width: 100%;
      margin-bottom: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    .lake-scene-svg {
      width: 100%;
      max-width: 330px;
      height: auto;
      display: block;
    }

    /* 首頁：啟程大廳 */
    .room-lobby-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-soft);
      padding: 12px 16px 28px 16px;
      box-shadow: 0 4px 20px rgba(61, 53, 47, 0.02);
      text-align: center;
      margin-top: 4px;
      transition: all 0.4s ease;
    }

    /* 手風琴摺疊大按鈕 (Accordion) */
    .lobby-accordion-btn {
      width: 100%;
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 15px 18px;
      margin-bottom: 10px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      outline: none;
    }
    .lobby-accordion-btn:hover {
      background: var(--theme-light);
      border-color: var(--warm-border);
    }
    .lobby-accordion-btn span {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }
    .lobby-accordion-arrow {
      font-size: 12px;
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }
    
    .lobby-accordion-btn.active {
      background: var(--theme-light);
      border-color: var(--warm-border);
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      margin-bottom: 0;
    }
    .lobby-accordion-btn.active .lobby-accordion-arrow {
      transform: rotate(180deg);
    }

    .lobby-accordion-drawer {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-top: none;
      border-bottom-left-radius: var(--radius-md);
      border-bottom-right-radius: var(--radius-md);
      padding: 18px 16px 22px 16px;
      margin-bottom: 12px;
      text-align: left;
      box-shadow: inset 0 -4px 12px rgba(61, 53, 47, 0.01);
    }
    .lobby-box-title {
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      line-height: 1.5;
      display: block;
      margin-bottom: 14px;
    }

    .lobby-form-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .lobby-btn-sub {
      width: 100%;
      background: var(--theme-main);
      color: #FFFFFF;
      border: none;
      padding: 11px 0;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.8px;
      cursor: pointer;
      text-align: center;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    .lobby-btn-sub:hover {
      background: var(--theme-dark);
    }

    /* 卡片共用樣式 */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-soft);
      padding: 15px 17px;
      box-shadow: 0 2px 10px rgba(61, 53, 47, 0.02);
      transition: all 0.4s ease;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .card-action-btn {
      font-size: 11px;
      color: var(--text-light);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .card-action-btn:hover {
      color: var(--rose-subtle);
    }

    /* 溫和公費卡片 */
    .kitty-compact-card {
      background: linear-gradient(135deg, var(--theme-soft), var(--theme-dark));
      color: #FFFFFF;
      border: none;
      padding: 16px 18px;
      box-shadow: 0 4px 14px rgba(61, 53, 47, 0.12);
      transition: all 0.4s ease;
    }
    .kitty-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .kitty-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .kitty-label {
      font-size: 11px;
      opacity: 0.9;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }
    .kitty-amount {
      font-size: 22px;
      font-weight: 500;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.5px;
      line-height: 1;
      white-space: nowrap;
    }
    .kitty-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn-kitty-sm {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #FFFFFF;
      font-size: 11px;
      padding: 5px 11px;
      border-radius: 16px;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-kitty-sm:hover {
      background: rgba(255, 255, 255, 0.28);
    }
    .kitty-custodian-bar {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      opacity: 0.94;
      letter-spacing: 0.5px;
    }
    .custodian-select {
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
    }
    .custodian-select option {
      color: var(--text-main);
    }

    /* 彈窗樣式 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 38, 32, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      padding: 16px;
    }
    .modal-box {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 24px 22px;
      width: 100%;
      max-width: 330px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
    }
    .modal-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: var(--text-main);
      margin-bottom: 14px;
    }

    /* 旅伴收支小記清單 */
    .stats-toggle-btn {
      background: none;
      border: none;
      color: var(--theme-soft);
      font-size: 11px;
      cursor: pointer;
      font-weight: 500;
      padding: 0 2px;
    }
    .stats-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stats-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FDFCFB;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 8px 11px;
      font-size: 12px;
    }
    .stats-name {
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 0.3px;
    }
    .stats-details {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 11px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }
    .stats-spent {
      color: var(--text-muted);
    }
    .stats-paid {
      color: var(--theme-dark);
      font-weight: 600;
    }

    /* 輸入元件 */
    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .input-text {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border-soft);
      background: #FDFCFB;
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .input-text:focus {
      border-color: var(--theme-soft);
      background: #FFFFFF;
    }
    
    .btn-add {
      background: var(--theme-main);
      color: #FFFFFF;
      border: none;
      padding: 9px 17px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      letter-spacing: 0.8px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 58px;
      text-align: center;
      transition: background 0.2s;
    }
    .btn-add:hover {
      background: var(--theme-dark);
    }

    .chips-box {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      min-height: 28px;
      align-items: center;
    }
    .member-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--theme-light);
      border: 1px solid var(--warm-border);
      padding: 4px 11px;
      border-radius: 16px;
      font-size: 12px;
      color: var(--theme-dark);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .chip-del {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 13px;
      cursor: pointer;
      line-height: 1;
    }
    .chip-del:hover {
      color: var(--rose-subtle);
    }

    /* 表單區 */
    .form-group {
      margin-bottom: 11px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 5px;
      white-space: nowrap;
    }
    .form-select {
      width: 100%;
      border: 1px solid var(--border-soft);
      background: #FDFCFB;
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
    }
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* 自費設定區 */
    .custom-box {
      background: #FDFCFB;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 11px;
    }
    .custom-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-toggle-custom {
      background: none;
      border: none;
      color: var(--theme-dark);
      font-size: 11px;
      letter-spacing: 0.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .custom-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
    }

    /* 分攤旅伴按鈕：極簡膠囊 */
    .split-chip {
      border: 1px solid var(--border-soft);
      background: #FDFCFB;
      color: var(--text-muted);
      font-size: 12px;
      padding: 5px 13px;
      border-radius: 16px;
      cursor: pointer;
      letter-spacing: 0.3px;
      white-space: nowrap;
      transition: all 0.2s;
      outline: none;
    }
    .split-chip.active {
      background: var(--theme-light);
      border-color: var(--warm-border);
      color: var(--theme-dark);
      font-weight: 600;
    }

    /* 操作按鈕組 */
    .btn-submit-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-clear-form {
      background: #F5F1ED;
      border: 1px solid var(--border-soft);
      color: var(--text-muted);
      padding: 10px 0;
      border-radius: var(--radius-sm);
      font-size: 12px;
      letter-spacing: 0.8px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .btn-save-expense {
      background: var(--theme-main);
      color: #FFFFFF;
      border: none;
      padding: 10px 0;
      border-radius: var(--radius-sm);
      font-size: 13px;
      letter-spacing: 0.8px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-save-expense:hover {
      background: var(--theme-dark);
    }

    /* 消費明細 */
    .expense-item {
      padding: 11px 0;
      border-bottom: 1px solid var(--border-soft);
      font-size: 12px;
    }
    .expense-item:last-child {
      border-bottom: none;
    }
    .expense-main-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-del-expense {
      background: none;
      border: none;
      color: var(--rose-subtle);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      margin-left: 8px;
    }
    .expense-detail-drawer {
      background: #FDFCFB;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 8px 11px;
      margin-top: 7px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 結算明細卡片 */
    .settle-card {
      background: #FDFCFB;
      border: 1px solid var(--border-soft);
      padding: 11px 13px;
      border-radius: var(--radius-sm);
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .settle-amount {
      color: var(--theme-dark);
      font-size: 14px;
      font-weight: 600;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      white-space: nowrap;
    }

    /* 收款帳號專區 */
    .account-card {
      background: #FDFCFB;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      margin-bottom: 8px;
    }
    .account-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 7px;
      width: 100%;
    }

      </div>

      <!-- 5. 花費動態 -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">花費動態</span>
          <div style="display:flex; gap:8px; align-items:center;">
            <span id="totalCostDisplay" style="color:var(--theme-dark); font-family:monospace; font-size:11px; font-weight:600;">累計：$0</span>
            <button type="button" id="btnClearExpenses" class="card-action-btn admin-only" onclick="clearAllExpenses()">清空花費</button>
          </div>
        </div>
        <div id="expenseList"></div>
      </div>

      <!-- 6. 結算明細 -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">結算明細</span>
          <button type="button" onclick="copySettlementSummary()" style="background:#FDFCFB; border:1px solid var(--border-soft); padding:3px 9px; border-radius:4px; font-size:10px; cursor:pointer; color:var(--text-muted);">複製清單</button>
        </div>
        <div id="settlementList"></div>

        <!-- 置底收款帳號專區 (防爆版設計) -->
        <div id="accountSection" style="margin-top:14px; padding-top:12px; border-top:1px dashed var(--border-soft);">
          <span class="card-title" style="display:block; margin-bottom:8px;">匯款帳號 (選填)</span>
          <div id="accountList"></div>
        </div>
      </div>

    </div>

  </div>

  <!-- 繳存公費彈窗 -->
  <div id="kittyModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-title">繳存公費</div>
      <div class="form-group">
        <label class="form-label">繳存方式</label>
        <select id="kittyDepositType" class="form-select" onchange="switchDepositType(this.value)">
          <option value="all">全員平均繳存</option>
          <option value="single">單一旅伴補繳</option>
          <option value="custom">自訂存入金額</option>
        </select>
      </div>
      <div id="kittySingleTargetGroup" class="form-group" style="display:none;">
        <label class="form-label">補繳旅伴</label>
        <select id="kittySingleTarget" class="form-select"></select>
      </div>
      <div class="form-group">
        <label class="form-label" id="kittyAmountLabel">每人金額</label>
        <input id="kittyAmountInput" type="number" class="input-text" style="width:100%;" placeholder="例如: 1000">
      </div>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button type="button" class="btn-clear-form" style="flex:1;" onclick="closeKittyModal()">取消</button>
        <button type="button" class="btn-save-expense" style="flex:1;" onclick="submitKittyDeposit()">確認存入</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. Firebase 連線設定 (固定專案金鑰)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDZEhQNAmZLDa-VRclvFLqUL7cZkvUKUjs",
      authDomain: "godutch-2026.firebaseapp.com",
      databaseURL: "https://godutch-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "godutch-2026",
      storageBucket: "godutch-2026.firebasestorage.app",
      messagingSenderId: "233149985381",
      appId: "1:233149985381:web:640fa0fb87f30b9b414c8c"
    };

    let db = null;
    let tripRef = null;

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      console.warn("Firebase 連線提示：", e);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const currentTripId = urlParams.get('trip');
    const isAdmin = urlParams.get('admin') === '1';

    // ==========================================
    // 2. 狀態資料模型
    // ==========================================
    let state = {
      createdAt: null,
      password: "",         
      members: [],          
      custodian: "",        
      memberBanks: {},      
      kittyDeposits: [],    
      expenses: []          
    };

    let selectedSplitters = [];
    let customSplits = [];
    let expandedExpenseId = null;
    let isStatsExpanded = false; 

    // ==========================================
    // 3. 四季主題切換 (Theme Toggle)
    // ==========================================
    function setSeasonTheme(season) {
      document.documentElement.setAttribute('data-theme', season);
      localStorage.setItem('godutch_preferred_season', season);
    }

    const savedSeason = localStorage.getItem('godutch_preferred_season') || 'autumn';
    setSeasonTheme(savedSeason);

    // 大廳手風琴 Accordion 動態折疊
    function toggleLobbyAccordion(type) {
      const drawerCreate = document.getElementById('drawer-create');
      const drawerJoin = document.getElementById('drawer-join');
      const btnCreate = document.querySelector('[onclick="toggleLobbyAccordion(\'create\')"]');
      const btnJoin = document.querySelector('[onclick="toggleLobbyAccordion(\'join\')"]');
      const arrowCreate = document.getElementById('arrow-create');
      const arrowJoin = document.getElementById('arrow-join');

      if (type === 'create') {
        const isCurrentlyOpen = drawerCreate.style.display === 'block';
        drawerCreate.style.display = isCurrentlyOpen ? 'none' : 'block';
        btnCreate.classList.toggle('active', !isCurrentlyOpen);
        arrowCreate.innerText = isCurrentlyOpen ? '▾' : '▴';

        drawerJoin.style.display = 'none';
        btnJoin.classList.remove('active');
        arrowJoin.innerText = '▾';
      } else {
        const isCurrentlyOpen = drawerJoin.style.display === 'block';
        drawerJoin.style.display = isCurrentlyOpen ? 'none' : 'block';
        btnJoin.classList.toggle('active', !isCurrentlyOpen);
        arrowJoin.innerText = isCurrentlyOpen ? '▾' : '▴';

        drawerCreate.style.display = 'none';
        btnCreate.classList.remove('active');
        arrowCreate.innerText = '▾';
      }
    }

    // ==========================================
    // 4. 旅程大廳與自訂代碼
    // ==========================================
    function generateRandomRoomCode() {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('customRoomCodeInput').value = code;
    }

    function createNewTripRoom() {
      let code = document.getElementById('customRoomCodeInput').value.trim().toLowerCase();
      let password = document.getElementById('customRoomPassInput').value.trim();
      
      if (!code) {
        alert('請填寫自訂旅程代碼，或點選「隨機」');
        return;
      }
      if (!/^[a-z0-9_-]+$/.test(code)) {
        alert('代碼僅限英文、數字、連字號（-）或底線（_），不含空格與中文。');
        return;
      }
      if (!password) {
        alert('請填寫總務管理密碼（日後以管理身分登入的憑證）');
        return;
      }

      if (db) {
        db.ref('trips/' + code).once('value', (snap) => {
          if (snap.exists() && snap.val() && snap.val().createdAt) {
            alert(`旅程代碼「${code}」已被使用，請重新設定代碼。`);
            return;
          } else {
            db.ref('trips/' + code).set({
              createdAt: Date.now(),
              password: password,
              members: [],
              custodian: "",
              kittyDeposits: [],
              expenses: [],
              memberBanks: {}
            }, () => {
              window.location.href = `${window.location.pathname}?trip=${code}&admin=1`;
            });
          }
        });
      } else {
        window.location.href = `${window.location.pathname}?trip=${code}&admin=1`;
      }
    }

    function joinExistingRoom() {
      const code = document.getElementById('joinRoomCodeInput').value.trim().toLowerCase();
      const inputPass = document.getElementById('joinRoomPassInput').value.trim();

      if (!code) {
        alert('請輸入旅程代碼');
        return;
      }

      if (db) {
        db.ref('trips/' + code).once('value', (snap) => {
          if (!snap.exists() || !snap.val()) {
            alert(`找不到代碼為「${code}」的旅程，將返回大廳。`);
            return;
          }
          
          const roomData = snap.val();
          if (inputPass) {
            if (roomData.password === inputPass) {
              window.location.href = `${window.location.pathname}?trip=${code}&admin=1`;
            } else {
              alert('管理密碼錯誤，請確認，或不填密碼以旅伴檢視身分進入');
            }
          } else {
            window.location.href = `${window.location.pathname}?trip=${code}`;
          }
        });
      } else {
        window.location.href = `${window.location.pathname}?trip=${code}`;
      }
    }

    function shareTripLinks() {
      const baseUrl = window.location.origin + window.location.pathname;
      const viewerUrl = `${baseUrl}?trip=${currentTripId}`;
      const adminUrl = `${baseUrl}?trip=${currentTripId}&admin=1`;

      const msg = `【遠行時光・旅程分帳】\n旅程代碼：${currentTripId}\n\n👉 旅伴查看連結（傳到 LINE 群）：\n${viewerUrl}\n\n🔑 總務管理連結（若需要管理）：\n${adminUrl}`;
      copyToClipboard(msg, '已複製旅程連結');
    }

    // ==========================================
    // 5. 資料同步與初始化
    // ==========================================
    function initDataSync() {
      if (!currentTripId) {
        document.getElementById('roomLobbySection').style.display = 'block';
        document.getElementById('mainAppSection').style.display = 'none';
        document.getElementById('btnShareTrip').style.display = 'none';
        document.getElementById('btnResetTrip').style.display = 'none';
        document.getElementById('roleBadge').style.display = 'none';
        return;
      }

      if (db) {
        db.ref('trips/' + currentTripId).once('value', (snap) => {
          if (!snap.exists() || !snap.val()) {
            if (!isAdmin) {
              alert(`找不到代碼為「${currentTripId}」的旅程，將返回大廳。`);
              window.location.href = window.location.pathname;
              return;
            }
          }
        });
      }

      document.getElementById('roomLobbySection').style.display = 'none';
      document.getElementById('mainAppSection').style.display = 'flex';
      document.getElementById('tripTitleDisplay').innerText = `${currentTripId}`;
      document.getElementById('btnShareTrip').style.display = 'block';

      const roleBadge = document.getElementById('roleBadge');
      if (isAdmin) {
        roleBadge.innerText = '總務管理';
        roleBadge.className = 'role-badge role-admin';
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
        document.getElementById('btnResetTrip').style.display = '';
        document.getElementById('btnOpenKittyDeposit').style.display = '';
        document.getElementById('custodianSelect').disabled = false;
      } else {
        roleBadge.innerText = '旅伴檢視';
        roleBadge.className = 'role-badge role-viewer';
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
        document.getElementById('btnResetTrip').style.display = 'none';
        document.getElementById('btnOpenKittyDeposit').style.display = 'none';
        document.getElementById('custodianSelect').disabled = true;
      }

      if (db) {
        tripRef = db.ref('trips/' + currentTripId);
        tripRef.on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) {
            state.createdAt = val.createdAt || Date.now();
            state.password = val.password || "";
            state.members = Array.isArray(val.members) ? val.members : [];
            state.custodian = val.custodian || "";
            state.memberBanks = val.memberBanks || {};
            state.kittyDeposits = Array.isArray(val.kittyDeposits) ? val.kittyDeposits : [];
            state.expenses = Array.isArray(val.expenses) ? val.expenses : [];
          } else {
            state = { createdAt: Date.now(), password: "", members: [], custodian: "", memberBanks: {}, kittyDeposits: [], expenses: [] };
          }
          selectedSplitters = state.members.slice();
          renderAll();
        });
      } else {
        const localKey = 'godutch_trip_' + currentTripId;
        const saved = localStorage.getItem(localKey);
        if (saved) {
          try { state = JSON.parse(saved); } catch (e) {}
        }
        selectedSplitters = state.members.slice();
        renderAll();
      }
    }

    function syncState() {
      if (tripRef && isAdmin) {
        if (!state.createdAt) state.createdAt = Date.now();
        tripRef.set(state);
      } else if (!db) {
        localStorage.setItem('godutch_trip_' + currentTripId, JSON.stringify(state));
      }
      renderAll();
    }

    // ==========================================
    // 6. 公費計算邏輯
    // ==========================================
    function getKittyBalance() {
      const inAmt = (state.kittyDeposits || []).reduce((acc, c) => acc + (Number(c.totalAmount) || 0), 0);
      const outAmt = (state.expenses || []).reduce((acc, c) => acc + (Number(c.kittyDeduction) || 0), 0);
      return inAmt - outAmt;
    }

    function changeCustodian(name) {
      if (!isAdmin) return;
      state.custodian = name;
      syncState();
    }

    function toggleKittyDrawer() {
      const drawer = document.getElementById('kittyDrawer');
      drawer.style.display = (drawer.style.display === 'none') ? 'block' : 'none';
    }

    function toggleStatsDrawer() {
      isStatsExpanded = !isStatsExpanded;
      const drawer = document.getElementById('statsDrawer');
      const btn = document.getElementById('btnToggleStats');
      if (isStatsExpanded) {
        drawer.style.display = 'block';
        btn.innerText = '收合 ▴';
      } else {
        drawer.style.display = 'none';
        btn.innerText = '展開 ▾';
      }
    }

    function openKittyModal() {
      if (!isAdmin) return;
      if (state.members.length === 0) {
        alert('請先在下方加入同行旅伴');
        return;
      }
      document.getElementById('kittyAmountInput').value = '';
      switchDepositType(document.getElementById('kittyDepositType').value);
      document.getElementById('kittyModal').style.display = 'flex';
    }

    function closeKittyModal() {
      document.getElementById('kittyModal').style.display = 'none';
    }

    function switchDepositType(type) {
      const targetGroup = document.getElementById('kittySingleTargetGroup');
      const targetSelect = document.getElementById('kittySingleTarget');
      const label = document.getElementById('kittyAmountLabel');

      if (type === 'single') {
        targetGroup.style.display = 'block';
        targetSelect.innerHTML = state.members.map(m => `<option value="${m}">${m}</option>`).join('');
        label.innerText = '補繳金額';
      } else if (type === 'custom') {
        targetGroup.style.display = 'none';
        label.innerText = '存入總額';
      } else {
        targetGroup.style.display = 'none';
        label.innerText = '每人金額';
      }
    }

    function submitKittyDeposit() {
      if (!isAdmin) return;
      const type = document.getElementById('kittyDepositType').value;
      const amount = parseFloat(document.getElementById('kittyAmountInput').value);
      if (isNaN(amount) || amount <= 0) {
        alert('請輸入有效金額');
        return;
      }

      let payer = "全員";
      let totalAmount = amount;

      if (type === 'all') {
        totalAmount = amount * state.members.length;
      } else if (type === 'single') {
        payer = document.getElementById('kittySingleTarget').value;
        totalAmount = amount;
      } else {
        payer = "自訂存入";
        totalAmount = amount;
      }

      state.kittyDeposits.push({
        id: String(Date.now()),
        type,
        payer,
        amount,
        totalAmount,
        time: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      });

      closeKittyModal();
      syncState();
    }

    function deleteKittyDeposit(id) {
      if (!isAdmin) return;
      state.kittyDeposits = state.kittyDeposits.filter(k => k.id !== String(id));
      syncState();
    }

    // ==========================================
    // 7. 旅伴名單管理
    // ==========================================
    function addMember() {
      if (!isAdmin) return;
      const input = document.getElementById('memberNameInput');
      const name = input.value ? input.value.trim() : '';
      if (!name) return alert('請輸入旅伴姓名');
      if (state.members.includes(name)) return alert('旅伴姓名重複');

      state.members.push(name);
      selectedSplitters.push(name);
      if (!state.custodian) state.custodian = name;
      input.value = '';
      syncState();
    }

    function removeMember(name) {
      if (!isAdmin) return;
      const inUse = state.expenses.some(e => e.payer === name || (e.splitWith && e.splitWith.includes(name)));
      if (inUse) return alert(`「${name}」在紀錄中已有帳目，請先刪除該項花費。`);

      state.members = state.members.filter(m => m !== name);
      selectedSplitters = selectedSplitters.filter(n => n !== name);
      if (state.custodian === name) state.custodian = state.members[0] || "";
      delete state.memberBanks[name];
      syncState();
    }

    function clearAllMembers() {
      if (!isAdmin) return;
      if (state.expenses.length > 0) return alert('已有消費紀錄，請先清空花費');
      if (confirm('確定清空所有同行旅伴？')) {
        state.members = [];
        state.custodian = "";
        state.memberBanks = {};
        selectedSplitters = [];
        syncState();
      }
    }

    // ==========================================
    // 8. 記錄花費
    // ==========================================
    function toggleCustomSection() {
      const area = document.getElementById('customArea');
      const btn = document.getElementById('customToggleBtn');
      if (area.style.display === 'none') {
        if (state.members.length === 0) return alert('請先加入同行旅伴');
        area.style.display = 'block';
        btn.innerText = '取消自費';
        if (customSplits.length === 0) addCustomRow();
      } else {
        area.style.display = 'none';
        btn.innerText = '＋ 新增自費';
        customSplits = [];
        renderCustomList();
      }
    }

    function addCustomRow() {
      if (state.members.length === 0) return;
      customSplits.push({ person: state.members[0], amount: 0 });
      renderCustomList();
    }

    function removeCustomRow(idx) {
      customSplits.splice(idx, 1);
      renderCustomList();
    }

    function renderCustomList() {
      const c = document.getElementById('customList');
      c.innerHTML = customSplits.map((row, idx) => `
        <div class="custom-row">
          <select onchange="customSplits[${idx}].person=this.value" class="form-select" style="width:auto; padding:5px 8px; font-size:12px;">
            ${state.members.map(m => `<option value="${m}" ${m === row.person ? 'selected' : ''}>${m}</option>`).join('')}
          </select>
          <span style="font-size:11px; white-space:nowrap; color:var(--text-muted);">自費</span>
          <input type="number" value="${row.amount || ''}" oninput="customSplits[${idx}].amount=parseFloat(this.value)||0" placeholder="金額" class="input-text" style="width:75px; padding:5px 8px; font-size:12px;">
          <span style="font-size:11px; white-space:nowrap; color:var(--text-muted);">元</span>
          <button type="button" onclick="removeCustomRow(${idx})" style="background:none; border:none; color:var(--rose-subtle); font-size:14px; cursor:pointer;">&times;</button>
        </div>
      `).join('');
    }

    function toggleSplitterAction(name) {
      const idx = selectedSplitters.indexOf(name);
      if (idx !== -1) selectedSplitters.splice(idx, 1);
      else selectedSplitters.push(name);
      renderSplitButtons();
    }

    function toggleAllSplitters() {
      if (selectedSplitters.length === state.members.length) selectedSplitters = [];
      else selectedSplitters = state.members.slice();
      renderSplitButtons();
    }

    function renderSplitButtons() {
      const c = document.getElementById('splitButtonsContainer');
      if (state.members.length === 0) {
        c.innerHTML = '<span style="font-size:11px; color:var(--text-light);">請先在上方加入成員</span>';
        return;
      }
      c.innerHTML = state.members.map(m => {
        const active = selectedSplitters.includes(m);
        return `
          <button type="button" class="split-chip ${active ? 'active' : ''}" onclick="toggleSplitterAction('${m}')">
            ${m}
          </button>
        `;
      }).join('');
    }

    function clearExpenseForm() {
      document.getElementById('itemTitle').value = '';
      document.getElementById('itemAmount').value = '';
      document.getElementById('payerSelect').value = state.custodian || (state.members[0] || '');
      customSplits = [];
      document.getElementById('customArea').style.display = 'none';
      document.getElementById('customToggleBtn').innerText = '＋ 新增自費';
      selectedSplitters = state.members.slice();
      renderSplitButtons();
      renderCustomList();
    }

    function addExpense() {
      if (!isAdmin) return;
      if (state.members.length === 0) return alert('請先加入同行旅伴');

      const titleInput = document.getElementById('itemTitle');
      const amountInput = document.getElementById('itemAmount');
      const payerSelect = document.getElementById('payerSelect');

      const title = titleInput.value ? titleInput.value.trim() : '';
      const amount = parseFloat(amountInput.value);
      const payer = payerSelect.value;

      if (!title) return alert('請填寫支出品項');
      if (isNaN(amount) || amount <= 0) return alert('請輸入有效金額');
      if (!payer) return alert('請選擇付款人');

      const customSum = customSplits.reduce((acc, c) => acc + (Number(c.amount) || 0), 0);
      if (customSum > amount) return alert('自費總和不能大於支出金額');
      if (selectedSplitters.length === 0 && (amount - customSum) > 0) return alert('請至少勾選一位分攤旅伴');

      let kittyDeduction = 0;
      let personalPaid = amount;

      if (payer === state.custodian) {
        const currentKitty = getKittyBalance();
        if (currentKitty > 0) {
          kittyDeduction = Math.min(amount, currentKitty);
          personalPaid = amount - kittyDeduction;
        }
      }

      state.expenses.push({
        id: String(Date.now()),
        title,
        amount,
        payer,
        kittyDeduction,
        personalPaid,
        customSplits: customSplits.filter(c => c.amount > 0),
        splitWith: selectedSplitters.slice()
      });

      clearExpenseForm();
      syncState();
    }

    function deleteExpense(id) {
      if (!isAdmin) return;
      state.expenses = state.expenses.filter(e => e.id !== String(id));
      syncState();
    }

    function clearAllExpenses() {
      if (!isAdmin) return;
      if (state.expenses.length === 0) return;
      if (confirm('確定清空所有花費紀錄？')) {
        state.expenses = [];
        syncState();
      }
    }

    // ==========================================
    // 9. 旅伴收支統計
    // ==========================================
    function computeMemberStatistics() {
      const stats = {};
      state.members.forEach(m => {
        stats[m] = { totalSpent: 0, totalPaid: 0 };
      });

      state.expenses.forEach(exp => {
        if (stats[exp.payer]) {
          stats[exp.payer].totalPaid += (Number(exp.personalPaid) || 0);
        }

        let rest = exp.amount;
        if (Array.isArray(exp.customSplits)) {
          exp.customSplits.forEach(cs => {
            if (stats[cs.person]) {
              stats[cs.person].totalSpent += Number(cs.amount) || 0;
              rest -= Number(cs.amount) || 0;
            }
          });
        }

        if (Array.isArray(exp.splitWith) && exp.splitWith.length > 0 && rest > 0) {
          const splitUnit = rest / exp.splitWith.length;
          exp.splitWith.forEach(p => {
            if (stats[p]) stats[p].totalSpent += splitUnit;
          });
        }
      });

      return stats;
    }

    // ==========================================
    // 10. 結算與零和演算法
    // ==========================================
    function computeSettlement() {
      const balance = {};
      state.members.forEach(m => balance[m] = 0);

      state.expenses.forEach(exp => {
        if (balance[exp.payer] !== undefined) {
          balance[exp.payer] += (Number(exp.personalPaid) || 0);
        }

        let rest = exp.amount;
        if (Array.isArray(exp.customSplits)) {
          exp.customSplits.forEach(cs => {
            if (balance[cs.person] !== undefined) {
              balance[cs.person] -= cs.amount;
              rest -= cs.amount;
            }
          });
        }

        if (Array.isArray(exp.splitWith) && exp.splitWith.length > 0 && rest > 0) {
          const splitAmt = rest / exp.splitWith.length;
          exp.splitWith.forEach(p => {
            if (balance[p] !== undefined) balance[p] -= splitAmt;
          });
        }
      });

      const kittyBal = getKittyBalance();
      if (state.members.length > 0 && kittyBal > 0) {
        const refundPerPerson = kittyBal / state.members.length;
        state.members.forEach(m => balance[m] += refundPerPerson);
        if (state.custodian && balance[state.custodian] !== undefined) {
          balance[state.custodian] -= kittyBal;
        }
      }

      const debtors = [];
      const creditors = [];
      for (const [person, net] of Object.entries(balance)) {
        const rounded = Math.round(net);
        if (rounded < -0.5) debtors.push({ person, amount: -rounded });
        else if (rounded > 0.5) creditors.push({ person, amount: rounded });
      }

      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const transactions = [];
      let i = 0, j = 0;
      const debtorsCopy = debtors.map(d => ({ ...d }));
      const creditorsCopy = creditors.map(c => ({ ...c }));

      while (i < debtorsCopy.length && j < creditorsCopy.length) {
        const d = debtorsCopy[i];
        const cr = creditorsCopy[j];
        const amt = Math.min(d.amount, cr.amount);

        transactions.push({ from: d.person, to: cr.person, amount: amt });
        d.amount -= amt;
        cr.amount -= amt;

        if (d.amount === 0) i++;
        if (cr.amount === 0) j++;
      }

      return { transactions, creditors, kittyLeftover: kittyBal };
    }

    function updateMemberBank(person, field, val) {
      if (!state.memberBanks[person]) state.memberBanks[person] = { code: "", account: "" };
      state.memberBanks[person][field] = val.trim();
      if (tripRef) {
        tripRef.child(`memberBanks/${person}/${field}`).set(val.trim());
      }
    }

    // ==========================================
    // 11. 畫面渲染
    // ==========================================
    function renderAll() {
      const kittyBal = getKittyBalance();
      document.getElementById('kittyBalanceDisplay').innerText = `$${Math.round(kittyBal).toLocaleString()}`;

      // 保管人選單
      const cSelect = document.getElementById('custodianSelect');
      cSelect.innerHTML = `<option value="">未指定</option>` + state.members.map(m => 
        `<option value="${m}" ${state.custodian === m ? 'selected' : ''}>${m}</option>`
      ).join('');

      // 公費紀錄抽屜
      const kLogs = document.getElementById('kittyDepositLogs');
      if (!state.kittyDeposits || state.kittyDeposits.length === 0) {
        kLogs.innerHTML = '<span style="opacity:0.7;">尚無公費繳存紀錄</span>';
      } else {
        kLogs.innerHTML = state.kittyDeposits.map(k => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:3px 0;">
            <span>${k.time} · ${k.payer} · $${k.totalAmount.toLocaleString()}</span>
            ${isAdmin ? `<button type="button" onclick="deleteKittyDeposit('${k.id}')" style="background:none; border:none; color:var(--rose-subtle); cursor:pointer;">&times;</button>` : ''}
          </div>
        `).join('');
      }

      // 旅伴收支小記
      const stats = computeMemberStatistics();
      const statsBox = document.getElementById('memberStatsContainer');
      if (state.members.length === 0) {
        statsBox.innerHTML = '<p class="empty-hint">尚未加入同行旅伴</p>';
      } else {
        statsBox.innerHTML = state.members.map(m => {
          const item = stats[m] || { totalSpent: 0, totalPaid: 0 };

          return `
            <div class="stats-item">
              <div>
                <span class="stats-name">${m}</span>
                ${m === state.custodian ? '<span style="font-size:10px; background:var(--theme-light); color:var(--theme-dark); padding:1px 5px; border-radius:3px; margin-left:4px;">總務</span>' : ''}
              </div>
              <div class="stats-details">
                <span class="stats-spent">花費 $${Math.round(item.totalSpent).toLocaleString()}</span>
                <span class="stats-paid">代墊 $${Math.round(item.totalPaid).toLocaleString()}</span>
              </div>
            </div>
          `;
        }).join('');
      }

      // 成員標籤
      document.getElementById('memberCountBadge').innerText = state.members.length;
      const mContainer = document.getElementById('membersContainer');
      mContainer.innerHTML = state.members.map(m => `
        <span class="member-chip">
          ${m}
          ${isAdmin ? `<button type="button" class="chip-del" onclick="removeMember('${m}')">&times;</button>` : ''}
        </span>
      `).join('') || '<span class="empty-hint" style="padding:0;">尚未加入任何旅伴</span>';

      // 付款人下拉選單
      const pSelect = document.getElementById('payerSelect');
      const curPayer = pSelect.value;
      pSelect.innerHTML = state.members.map(m => 
        `<option value="${m}" ${(curPayer === m || (!curPayer && m === state.custodian)) ? 'selected' : ''}>${m}${m === state.custodian ? ' (公費優先扣抵)' : ''}</option>`
      ).join('');

      renderSplitButtons();
      renderCustomList();

      // 消費明細列表
      const expList = document.getElementById('expenseList');
      let total = 0;
      if (state.expenses.length === 0) {
        expList.innerHTML = '<p class="empty-hint">尚無花費紀錄</p>';
      } else {
        expList.innerHTML = state.expenses.slice().reverse().map(e => {
          total += Number(e.amount) || 0;
          const isExpanded = expandedExpenseId === e.id;
          const hasKitty = e.kittyDeduction > 0;

          return `
            <div class="expense-item">
              <div class="expense-main-row">
                <div>
                  <span style="font-weight:500; color:var(--text-main);">${e.title}</span>
                  <span style="color:var(--theme-dark); font-weight:600; font-family:monospace; margin-left:4px;">$${Math.round(e.amount).toLocaleString()}</span>
                </div>
                <div style="display:flex; align-items:center;">
                  <button type="button" onclick="toggleExpandExpense('${e.id}')" style="background:none; border:none; color:var(--theme-dark); font-size:11px; cursor:pointer;">
                    ${isExpanded ? '收合 ▴' : '明細 ▾'}
                  </button>
                  ${isAdmin ? `<button type="button" class="btn-del-expense" onclick="deleteExpense('${e.id}')">刪除</button>` : ''}
                </div>
              </div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">
                ${e.payer} 付 · ${(e.splitWith || []).length} 人分攤
                ${hasKitty ? ` · <span style="color:var(--theme-dark);">(公費扣抵 $${Math.round(e.kittyDeduction).toLocaleString()}${e.personalPaid > 0 ? ` + 個人代墊 $${Math.round(e.personalPaid).toLocaleString()}` : ''})</span>` : ''}
              </div>
              ${isExpanded ? `
                <div class="expense-detail-drawer">
                  <div style="margin-bottom:4px;"><strong>分攤旅伴：</strong>${(e.splitWith || []).join('、 ')}</div>
                  ${(e.customSplits && e.customSplits.length) ? `<div><strong>特定自費：</strong>${e.customSplits.map(c=>`${c.person}$${c.amount}`).join('、 ')}</div>` : ''}
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      }
      document.getElementById('totalCostDisplay').innerText = `累計：$${Math.round(total).toLocaleString()}`;

      // 結算轉帳清單
      const setList = document.getElementById('settlementList');
      const { transactions, creditors } = computeSettlement();
      if (transactions.length === 0) {
        setList.innerHTML = '<p class="empty-hint">目前帳目已平衡，無須轉帳</p>';
      } else {
        setList.innerHTML = transactions.map(t => `
          <div class="settle-card">
            <span style="font-size:12px;"><strong>${t.from}</strong> ➔ 應轉給 <strong>${t.to}</strong></span>
            <span class="settle-amount">$${t.amount.toLocaleString()}</span>
          </div>
        `).join('');
      }

      // 收款人帳號專區
      const accList = document.getElementById('accountList');
      if (creditors.length === 0) {
        accList.innerHTML = '<span style="font-size:11px; color:var(--text-light);">尚無收款需求</span>';
      } else {
        accList.innerHTML = creditors.map(c => {
          const bankData = state.memberBanks[c.person] || { code: "", account: "" };
          return `
            <div class="account-card">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px; font-weight:600; color:var(--text-main);">${c.person}</span>
                <span style="font-size:11px; color:var(--theme-dark); font-weight:600;">應收：$${c.amount.toLocaleString()}</span>
              </div>
              <div class="account-row">
                <input type="text" maxlength="3" class="bank-code-input" placeholder="代碼" value="${bankData.code || ''}" 
                       onchange="updateMemberBank('${c.person}', 'code', this.value)">
                <input type="text" class="bank-account-input" placeholder="帳號" value="${bankData.account || ''}" 
                       onchange="updateMemberBank('${c.person}', 'account', this.value)">
                <button type="button" class="btn-copy-sm" onclick="copyPureAccount('${bankData.account}', '${c.person}')">複製</button>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    function toggleExpandExpense(id) {
      expandedExpenseId = (expandedExpenseId === id) ? null : id;
      renderAll();
    }

    function copyPureAccount(acc, name) {
      if (!acc) return alert(`請先填寫 ${name} 的帳號`);
      copyToClipboard(acc.replace(/[^0-9]/g, ''), `已複製 ${name} 的銀行帳號`);
    }

    function copyToClipboard(txt, msg) {
      if (!txt) return;
      const input = document.createElement('textarea');
      input.value = txt;
      document.body.appendChild(input);
      input.select();
      try {
        document.execCommand('copy');
        alert(msg || '已複製');
      } catch (err) {
        prompt('請長按複製：', txt);
      }
      document.body.removeChild(input);
    }

    function copySettlementSummary() {
      const { transactions, creditors, kittyLeftover } = computeSettlement();
      if (transactions.length === 0) return alert('目前無須轉帳');

      let out = '🌾【旅途結算清單】\n';
      transactions.forEach(t => {
        out += `👉 ${t.from} 應轉給 ${t.to}：$${t.amount.toLocaleString()} 元\n`;
      });

      if (kittyLeftover > 0 && state.custodian) {
        out += `\n💡 備註：公費剩餘現鈔 $${Math.round(kittyLeftover).toLocaleString()} 已由總務【${state.custodian}】直接抵銷。\n`;
      }

      out += '\n【收款人帳號】\n';
      creditors.forEach(c => {
        const b = state.memberBanks[c.person] || { code: "", account: "" };
        out += `🏦 ${c.person}：銀行代碼 ${b.code || '未填'} 帳號 ${b.account || '未填'}\n`;
      });

      copyToClipboard(out, '已複製結算清單，可直接貼至 LINE 群組！');
    }

    function resetEntireTrip() {
      if (!isAdmin) return;
      if (confirm('確定要清空這趟旅程的所有紀錄（人員、公費、帳目）嗎？')) {
        state = { createdAt: Date.now(), password: "", members: [], custodian: "", memberBanks: {}, kittyDeposits: [], expenses: [] };
        selectedSplitters = [];
        customSplits = [];
        syncState();
      }
    }

    // 啟動初始化
    initDataSync();
  </script>
</body>
</html>
