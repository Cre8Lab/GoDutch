<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>遠行時光・旅途分帳與公基金小幫手</title>

  <!-- Firebase 相容版本 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* ========================================================
       低飽和日系四季粉柔色盤 (春・夏・秋・冬)
       ======================================================== */
    :root {
      --bg-warm: #FAF8F8;
      --card-bg: #FFFFFF;
      --text-main: #3C3835;
      --text-muted: #7E7670;
      --text-light: #B2AAA4;
      --border-soft: #EDE8E3;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;

      /* 預設為：🌸 春・櫻落粉 */
      --theme-main: #C88A8A;
      --theme-dark: #8E5656;
      --theme-light: #F7EEEE;
      --theme-border: #E8D3D3;
      --kitty-gradient-1: #D29898;
      --kitty-gradient-2: #B37474;
    }

    /* 🌸 春・櫻落粉 (Spring) */
    body[data-theme="spring"] {
      --bg-warm: #FAF8F8;
      --theme-main: #C88A8A;
      --theme-dark: #8E5656;
      --theme-light: #F7EEEE;
      --theme-border: #E8D3D3;
      --kitty-gradient-1: #D29898;
      --kitty-gradient-2: #B37474;
    }

    /* 🌿 夏・夏木綠 (Summer) */
    body[data-theme="summer"] {
      --bg-warm: #F8FAF8;
      --theme-main: #7D9D8B;
      --theme-dark: #577564;
      --theme-light: #EBF2ED;
      --theme-border: #D2E3D7;
      --kitty-gradient-1: #8EAC9B;
      --kitty-gradient-2: #6B8C7A;
    }

    /* 🍁 秋・銀杏黃 (Autumn) */
    body[data-theme="autumn"] {
      --bg-warm: #FAF9F6;
      --theme-main: #BFA06E;
      --theme-dark: #917548;
      --theme-light: #F7F2EA;
      --theme-border: #EADBCA;
      --kitty-gradient-1: #C9AD7F;
      --kitty-gradient-2: #A88B5B;
    }

    /* ❄️ 冬・暮雪藍 (Winter) */
    body[data-theme="winter"] {
      --bg-warm: #F8FAFB;
      --theme-main: #7B9EA8;
      --theme-dark: #58757E;
      --theme-light: #EBF2F4;
      --theme-border: #D2E2E6;
      --kitty-gradient-1: #8CAAB3;
      --kitty-gradient-2: #6D8E98;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-warm);
      color: var(--text-main);
      padding-bottom: 96px;
      -webkit-tap-highlight-color: transparent;
      line-height: 1.5;
      transition: background-color 0.3s ease;
    }

    /* 頂部導航 */
    .header {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-soft);
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 10px 16px;
    }
    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .brand-leaf {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--theme-main);
      flex-shrink: 0;
      transition: background 0.3s ease;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .role-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .role-admin {
      background: var(--theme-light);
      color: var(--theme-dark);
      border: 1px solid var(--theme-border);
    }
    .role-viewer {
      background: #F4F1EE;
      color: var(--text-muted);
      border: 1px solid var(--border-soft);
    }

    /* 頂部四季切換小圓球 */
    .theme-picker-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      padding: 2px 4px;
    }
    .theme-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      outline: none;
      transition: transform 0.2s, border-color 0.2s;
    }
    .theme-dot:active {
      transform: scale(0.9);
    }
    .theme-dot.active {
      border-color: #3C3835;
      transform: scale(1.15);
    }
    .theme-dot-spring { background-color: #D29898; }
    .theme-dot-summer { background-color: #8EAC9B; }
    .theme-dot-autumn { background-color: #C9AD7F; }
    .theme-dot-winter { background-color: #8CAAB3; }

    .header-actions-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-soft);
      overflow-x: auto;
    }
    .btn-header-link {
      font-size: 11px;
      color: var(--theme-dark);
      background: var(--theme-light);
      border: 1px solid var(--theme-border);
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-header-sub {
      font-size: 11px;
      color: var(--text-muted);
      background: #FFFFFF;
      border: 1px solid var(--border-soft);
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-header-sub:hover {
      background: var(--bg-warm);
      color: var(--text-main);
    }
    .btn-reset-all {
      font-size: 11px;
      color: var(--text-light);
      background: none;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      margin-left: auto;
      padding: 4px 6px;
      transition: color 0.2s;
    }
    .btn-reset-all:hover {
      color: #BA7C7C;
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    /* 首頁：啟程大廳 */
    .room-lobby-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-soft);
      padding: 24px 18px;
      box-shadow: 0 4px 20px rgba(60, 56, 53, 0.02);
      margin-top: 4px;
    }
    .room-lobby-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 4px;
    }
    .room-lobby-sub {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }
    .lobby-box {
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      padding: 14px 14px;
      border-radius: var(--radius-md);
      margin-bottom: 12px;
    }
    .lobby-box-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--theme-dark);
      display: block;
      margin-bottom: 4px;
    }
    .lobby-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 10px;
    }

    /* 卡片共用樣式 */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-soft);
      padding: 14px 15px;
      box-shadow: 0 2px 10px rgba(60, 56, 53, 0.02);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      white-space: nowrap;
    }
    .card-action-btn {
      font-size: 11px;
      color: var(--text-light);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .card-action-btn:hover {
      color: #BA7C7C;
    }

    /* 公基金未啟用開關列 */
    .kitty-toggle-banner {
      background: var(--bg-warm);
      border: 1px dashed var(--theme-border);
      border-radius: var(--radius-md);
      padding: 11px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .kitty-toggle-banner:hover {
      background: var(--theme-light);
    }
    .kitty-toggle-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--theme-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .kitty-toggle-btn {
      background: var(--theme-main);
      color: #FFF;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    /* 四季粉柔公基金卡片 */
    .kitty-compact-card {
      background: linear-gradient(135deg, var(--kitty-gradient-1), var(--kitty-gradient-2));
      color: #FFFFFF;
      border: none;
      padding: 15px 16px;
      box-shadow: 0 4px 14px rgba(60, 56, 53, 0.08);
      transition: background 0.3s ease;
    }
    .kitty-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .kitty-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .kitty-label {
      font-size: 11px;
      opacity: 0.92;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }
    .kitty-amount {
      font-size: 23px;
      font-weight: 600;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.5px;
      line-height: 1;
      white-space: nowrap;
    }
    .kitty-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn-kitty-sm {
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #FFFFFF;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 16px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-kitty-sm:hover {
      background: rgba(255, 255, 255, 0.32);
    }
    .kitty-custodian-bar {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      opacity: 0.95;
    }
    .custodian-select {
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
    }
    .custodian-select option {
      color: var(--text-main);
    }

    /* 旅伴網格系統：文字居中且截斷防爆版 */
    .chips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      gap: 6px;
      margin-top: 10px;
      width: 100%;
    }
    .member-chip {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: var(--theme-light);
      border: 1px solid var(--theme-border);
      padding: 6px 18px 6px 8px;
      border-radius: 16px;
      font-size: 12px;
      color: var(--theme-dark);
      min-width: 0;
      text-align: center;
      transition: all 0.3s ease;
    }
    .member-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: inline-block;
      width: 100%;
      text-align: center;
      font-weight: 500;
    }
    .chip-del {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 13px;
      cursor: pointer;
      line-height: 1;
    }
    .chip-del:hover {
      color: #BA7C7C;
    }

    /* 分攤旅伴按鈕：自適應網格等寬排列、文字居中 */
    .split-chip {
      border: 1px solid var(--border-soft);
      background: var(--bg-warm);
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 6px;
      border-radius: 16px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
      outline: none;
      width: 100%;
    }
    .split-chip.active {
      background: var(--theme-light);
      border-color: var(--theme-border);
      color: var(--theme-dark);
      font-weight: 600;
    }

    /* 輸入元件 */
    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .input-text {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border-soft);
      background: var(--bg-warm);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .input-text:focus {
      border-color: var(--theme-main);
      background: #FFFFFF;
    }
    
    .btn-add {
      background: var(--theme-main);
      color: #FFFFFF;
      border: none;
      padding: 8px 15px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      letter-spacing: 0.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .btn-add:hover {
      opacity: 0.88;
    }

    /* 表單區 */
    .form-group {
      margin-bottom: 10px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
      white-space: nowrap;
    }
    .form-select {
      width: 100%;
      border: 1px solid var(--border-soft);
      background: var(--bg-warm);
      border-radius: var(--radius-sm);
      padding: 8px 8px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
    }
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* 自費設定區 */
    .custom-box {
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 10px 10px;
      margin-bottom: 10px;
    }
    .custom-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-toggle-custom {
      background: none;
      border: none;
      color: var(--theme-dark);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }
    .custom-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
    }

    /* 操作按鈕組 */
    .btn-submit-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-clear-form {
      background: #F4F1EE;
      border: 1px solid var(--border-soft);
      color: var(--text-muted);
      padding: 9px 0;
      border-radius: var(--radius-sm);
      font-size: 12px;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .btn-save-expense {
      background: var(--theme-main);
      color: #FFFFFF;
      border: none;
      padding: 9px 0;
      border-radius: var(--radius-sm);
      font-size: 13px;
      letter-spacing: 0.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .btn-save-expense:hover {
      opacity: 0.9;
    }

    /* 消費明細 */
    .expense-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border-soft);
      font-size: 12px;
    }
    .expense-item:last-child {
      border-bottom: none;
    }
    .expense-main-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-del-expense {
      background: none;
      border: none;
      color: #BA7C7C;
      font-size: 11px;
      cursor: pointer;
      margin-left: 8px;
    }
    .expense-detail-drawer {
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 結算明細卡片 */
    .settle-card {
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .settle-amount {
      color: var(--theme-dark);
      font-size: 14px;
      font-weight: 600;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      white-space: nowrap;
    }

    /* 收款帳號 */
    .account-card {
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .account-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
      width: 100%;
    }
    .bank-code-input {
      width: 68px;
      flex-shrink: 0;
      text-align: center;
      border: 1px solid var(--border-soft);
      background: #FFFFFF;
      border-radius: 6px;
      padding: 6px 4px;
      font-size: 12px;
      outline: none;
    }
    .bank-account-input {
      flex: 1 1 auto;
      min-width: 0;
      border: 1px solid var(--border-soft);
      background: #FFFFFF;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      outline: none;
    }
    .btn-copy-sm {
      flex-shrink: 0;
      background: #FFFFFF;
      border: 1px solid var(--theme-border);
      color: var(--theme-dark);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .empty-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-light);
      padding: 12px 0;
    }

    /* 彈窗樣式 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(60, 56, 53, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-box {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 22px 20px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.1);
    }
    .modal-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    /* 自訂吐司提示 */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(60, 56, 53, 0.94);
      color: #FFF;
      font-size: 12px;
      padding: 9px 18px;
      border-radius: 20px;
      z-index: 200;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      pointer-events: none;
      display: none;
      letter-spacing: 0.5px;
      animation: fadeInOut 2.4s forwards;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, 8px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      80% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -8px); }
    }
  </style>
</head>
<body data-theme="spring">

  <!-- 頂部導航 -->
  <header class="header">
    <div class="header-top-row">
      <div class="header-brand">
        <span class="brand-leaf"></span>
        <h1 id="tripTitleDisplay">遠行時光</h1>
        <span id="roleBadge" class="role-badge role-viewer">旅伴檢視</span>
      </div>

        <button type="button" class="btn-clear-form" style="flex:1;" id="btnConfirmCancel">取消</button>

  <!-- 自訂吐司提示 -->
  <div id="toast" class="toast-container"></div>

  <script>
    // ==========================================
    // 0. 四季色盤切換 (春 spring / 夏 summer / 秋 autumn / 冬 winter)
    // ==========================================
    function setAppTheme(themeName) {
      document.body.setAttribute('data-theme', themeName);
      localStorage.setItem('godutch_theme', themeName);

      // 更新按鈕 active 樣式
      document.querySelectorAll('.theme-dot').forEach(btn => {
        btn.classList.remove('active');
        if (btn.classList.contains('theme-dot-' + themeName)) {
          btn.classList.add('active');
        }
      });
    }

    // 初始化讀取使用者偏好色系 (預設為春季 spring)
    const savedTheme = localStorage.getItem('godutch_theme') || 'spring';
    setAppTheme(savedTheme);

    // ==========================================
    // 1. Firebase 連線設定
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDZEhQNAmZLDa-VRclvFLqUL7cZkvUKUjs",
      authDomain: "godutch-2026.firebaseapp.com",
      databaseURL: "https://godutch-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "godutch-2026",
      storageBucket: "godutch-2026.firebasestorage.app",
      messagingSenderId: "233149985381",
      appId: "1:233149985381:web:640fa0fb87f30b9b414c8c"
    };

    let db = null;
    let tripRef = null;

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      console.warn("Firebase 連線提示：", e);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const currentTripId = urlParams.get('trip');
    let isAdmin = urlParams.get('admin') === '1';

    // ==========================================
    // 2. 狀態模型與自訂提示
    // ==========================================
    let state = {
      createdAt: null,
      adminPin: "",
      kittyEnabled: false, // 預設關閉公基金 (純代墊模式)
      members: [],          
      custodian: "",        
      memberBanks: {},      
      kittyDeposits: [],    
      expenses: []          
    };

    let selectedSplitters = [];
    let customSplits = [];
    let expandedExpenseId = null;
    let isStatsExpanded = false;

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.style.display = 'none';
      }, 2300);
    }

    function showConfirm(msg, onOk, onCancel) {
      const modal = document.getElementById('confirmModal');
      const text = document.getElementById('confirmModalMsg');
      const okBtn = document.getElementById('btnConfirmOk');
      const cancelBtn = document.getElementById('btnConfirmCancel');

      text.innerText = msg;
      modal.style.display = 'flex';

      okBtn.onclick = () => {
        modal.style.display = 'none';
        if (onOk) onOk();
      };
      cancelBtn.onclick = () => {
        modal.style.display = 'none';
        if (onCancel) onCancel();
      };
    }

    // ==========================================
    // 3. 旅程大廳與登入邏輯
    // ==========================================
    function generateRandomRoomCode() {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('customRoomCodeInput').value = code;
    }

    function handleAdminEntry() {
      const code = document.getElementById('customRoomCodeInput').value.trim().toLowerCase();
      const pin = document.getElementById('customRoomPinInput').value.trim();

      if (!code) return showToast('請輸入旅程代碼');
      if (!/^[a-z0-9_-]+$/.test(code)) return showToast('代碼僅限英文、數字、- 或 _');
      if (!/^\d{4}$/.test(pin)) return showToast('請輸入 4 位數純數字密碼');

      if (!db) {
        window.location.href = `${window.location.pathname}?trip=${code}&admin=1`;
        return;
      }

      db.ref('trips/' + code).once('value', (snap) => {
        const val = snap.val();
        if (snap.exists() && val && val.createdAt) {
          if (val.adminPin) {
            if (val.adminPin === pin) {
              sessionStorage.setItem('godutch_auth_' + code, pin);
              window.location.href = `${window.location.pathname}?trip=${code}&admin=1`;
            } else {
              showToast('密碼錯誤，請確認後重新輸入');
            }
          } else {
            db.ref('trips/' + code + '/adminPin').set(pin);
            sessionStorage.setItem('godutch_auth_' + code, pin);
            window.location.href = `${window.location.pathname}?trip=${code}&admin=1`;
          }
        } else {
          db.ref('trips/' + code).set({
            createdAt: Date.now(),
            adminPin: pin,
            kittyEnabled: false,
            members: [],
            custodian: "",
            kittyDeposits: [],
            expenses: [],
            memberBanks: {}
          }, () => {
            sessionStorage.setItem('godutch_auth_' + code, pin);
            window.location.href = `${window.location.pathname}?trip=${code}&admin=1`;
          });
        }
      });
    }

    function joinExistingRoom() {
      const code = document.getElementById('joinRoomCodeInput').value.trim().toLowerCase();
      if (!code) return showToast('請輸入旅程代碼');

      if (db) {
        db.ref('trips/' + code).once('value', (snap) => {
          if (!snap.exists() || !snap.val()) {
            return showToast(`找不到代碼為「${code}」的旅程`);
          }
          window.location.href = `${window.location.pathname}?trip=${code}`;
        });
      } else {
        window.location.href = `${window.location.pathname}?trip=${code}`;
      }
    }

    function shareTripLinks() {
      const baseUrl = window.location.origin + window.location.pathname;
      const viewerUrl = `${baseUrl}?trip=${currentTripId}`;
      const msg = `【遠行時光・旅程分帳】\n旅程代碼：${currentTripId}\n\n👉 旅伴查看連結：\n${viewerUrl}`;
      copyToClipboard(msg, '已複製旅伴查看連結');
    }

    function shareAdminAccess() {
      const baseUrl = window.location.origin + window.location.pathname;
      const adminUrl = `${baseUrl}?trip=${currentTripId}&admin=1`;
      const pin = state.adminPin || '未設定';
      const msg = `【遠行時光・旅程分帳】\n旅程代碼：${currentTripId}\n總務密碼：${pin}\n\n👉 總務管理連結：\n${adminUrl}`;
      copyToClipboard(msg, '已複製總務管理連結與密碼');
    }

    // ==========================================
    // 4. 資料同步與嚴格驗證
    // ==========================================
    let pinModalResolver = null;

    function requestPinFromModal() {
      return new Promise((resolve) => {
        pinModalResolver = resolve;
        document.getElementById('pinModalInput').value = '';
        document.getElementById('pinModal').style.display = 'flex';
        setTimeout(() => document.getElementById('pinModalInput').focus(), 100);
      });
    }

    function confirmPinModal() {
      const val = document.getElementById('pinModalInput').value.trim();
      document.getElementById('pinModal').style.display = 'none';
      if (pinModalResolver) pinModalResolver(val);
    }

    function cancelPinModal() {
      document.getElementById('pinModal').style.display = 'none';
      if (pinModalResolver) pinModalResolver(null);
    }

    async function initDataSync() {
      if (!currentTripId) {
        document.getElementById('roomLobbySection').style.display = 'block';
        document.getElementById('mainAppSection').style.display = 'none';
        document.getElementById('btnShareTrip').style.display = 'none';
        document.getElementById('adminHeaderBar').style.display = 'none';
        document.getElementById('roleBadge').style.display = 'none';
        return;
      }

      if (db) {
        const snap = await db.ref('trips/' + currentTripId).once('value');
        if (!snap.exists() || !snap.val()) {
          showToast(`找不到代碼為「${currentTripId}」的旅程，將返回大廳`);
          setTimeout(() => { window.location.href = window.location.pathname; }, 1200);
          return;
        }

        const data = snap.val();

        if (isAdmin && data.adminPin) {
          const cachedPin = sessionStorage.getItem('godutch_auth_' + currentTripId);
          if (cachedPin !== data.adminPin) {
            const entered = await requestPinFromModal();
            if (entered === data.adminPin) {
              sessionStorage.setItem('godutch_auth_' + currentTripId, entered);
              isAdmin = true;
            } else {
              isAdmin = false;
              window.history.replaceState({}, '', `${window.location.pathname}?trip=${currentTripId}`);
              showToast(entered ? '密碼錯誤，切換為旅伴檢視' : '已進入旅伴檢視模式');
            }
          }
        }
      }

      document.getElementById('roomLobbySection').style.display = 'none';
      document.getElementById('mainAppSection').style.display = 'flex';
      document.getElementById('tripTitleDisplay').innerText = `${currentTripId}`;
      document.getElementById('btnShareTrip').style.display = 'block';

      updateRoleUI();

      if (db) {
        tripRef = db.ref('trips/' + currentTripId);
        tripRef.on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) {
            state.createdAt = val.createdAt || Date.now();
            state.adminPin = val.adminPin || "";
            state.kittyEnabled = (val.kittyEnabled === true);
            state.members = Array.isArray(val.members) ? val.members : [];
            state.custodian = val.custodian || "";
            state.memberBanks = val.memberBanks || {};
            state.kittyDeposits = Array.isArray(val.kittyDeposits) ? val.kittyDeposits : [];
            state.expenses = Array.isArray(val.expenses) ? val.expenses : [];
          } else {
            state = { createdAt: Date.now(), adminPin: "", kittyEnabled: false, members: [], custodian: "", memberBanks: {}, kittyDeposits: [], expenses: [] };
          }
          selectedSplitters = state.members.slice();
          renderAll();
        });
      } else {
        const localKey = 'godutch_trip_' + currentTripId;
        const saved = localStorage.getItem(localKey);
        if (saved) {
          try { state = JSON.parse(saved); } catch (e) {}
        }
        selectedSplitters = state.members.slice();
        renderAll();
      }
    }

    function updateRoleUI() {
      const roleBadge = document.getElementById('roleBadge');
      if (isAdmin) {
        roleBadge.innerText = '總務管理';
        roleBadge.className = 'role-badge role-admin';
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
        document.getElementById('adminHeaderBar').style.display = 'flex';

    function syncState() {
      if (tripRef && isAdmin) {
        if (!state.createdAt) state.createdAt = Date.now();
        tripRef.set(state);
      } else if (!db) {
        localStorage.setItem('godutch_trip_' + currentTripId, JSON.stringify(state));
      }
      renderAll();
    }

    // ==========================================
    // 5. 公基金開關與運算
    // ==========================================
    function toggleKittyFeature(enable) {
      if (!isAdmin) return;
      if (!enable && getKittyBalance() !== 0) {
        showConfirm('目前公基金仍有餘額或收支，確定要關閉公基金功能嗎？（記錄仍會保留）', () => {
          state.kittyEnabled = false;
          syncState();
          showToast('已關閉公基金功能');
        });
        return;
      }
      state.kittyEnabled = enable;
      syncState();
      showToast(enable ? '已啟用公基金功能' : '已關閉公基金功能');
    }

    function getKittyBalance() {
      if (!state.kittyEnabled) return 0;
      const inAmt = (state.kittyDeposits || []).reduce((acc, c) => acc + (Number(c.totalAmount) || 0), 0);
      const outAmt = (state.expenses || []).reduce((acc, c) => acc + (Number(c.kittyDeduction) || 0), 0);
      return inAmt - outAmt;
    }

    function changeCustodian(name) {
      if (!isAdmin) return;
      state.custodian = name;
      syncState();
    }

    function toggleKittyDrawer() {
      const drawer = document.getElementById('kittyDrawer');
      drawer.style.display = (drawer.style.display === 'none') ? 'block' : 'none';
    }

    function toggleStatsDrawer() {
      isStatsExpanded = !isStatsExpanded;
      const drawer = document.getElementById('statsDrawer');
      const btn = document.getElementById('btnToggleStats');
      if (isStatsExpanded) {
        drawer.style.display = 'block';
        btn.innerText = '收合 ▴';
      } else {
        drawer.style.display = 'none';
        btn.innerText = '展開 ▾';
      }
    }

    function openKittyModal() {
      if (!isAdmin) return;
      if (state.members.length === 0) return showToast('請先在下方加入同行旅伴');
      document.getElementById('kittyAmountInput').value = '';
      switchDepositType(document.getElementById('kittyDepositType').value);
      document.getElementById('kittyModal').style.display = 'flex';
    }

    function closeKittyModal() {
      document.getElementById('kittyModal').style.display = 'none';
    }

    function switchDepositType(type) {
      const targetGroup = document.getElementById('kittySingleTargetGroup');
      const targetSelect = document.getElementById('kittySingleTarget');
      const label = document.getElementById('kittyAmountLabel');

      if (type === 'single') {
        targetGroup.style.display = 'block';
        targetSelect.innerHTML = state.members.map(m => `<option value="${m}">${m}</option>`).join('');
        label.innerText = '收款金額';
      } else if (type === 'custom') {
        targetGroup.style.display = 'none';
        label.innerText = '收款總額';
      } else {
        targetGroup.style.display = 'none';
        label.innerText = '每人金額';
      }
    }

    function submitKittyDeposit() {
      if (!isAdmin) return;
      const type = document.getElementById('kittyDepositType').value;
      const amount = parseFloat(document.getElementById('kittyAmountInput').value);
      if (isNaN(amount) || amount <= 0) return showToast('請輸入有效金額');

      let payer = "全員";
      let totalAmount = amount;

      if (type === 'all') {
        totalAmount = amount * state.members.length;
      } else if (type === 'single') {
        payer = document.getElementById('kittySingleTarget').value;
        totalAmount = amount;
      } else {
        payer = "自訂收款";
        totalAmount = amount;
      }

      state.kittyDeposits.push({
        id: String(Date.now()),
        type,
        payer,
        amount,
        totalAmount,
        time: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      });

      closeKittyModal();
      syncState();
    }

    function deleteKittyDeposit(id) {
      if (!isAdmin) return;
      state.kittyDeposits = state.kittyDeposits.filter(k => k.id !== String(id));
      syncState();
    }

    function addMember() {
      if (!isAdmin) return;
      const input = document.getElementById('memberNameInput');
      const name = input.value ? input.value.trim() : '';
      if (!name) return showToast('請輸入旅伴姓名');
      if (state.members.includes(name)) return showToast('旅伴姓名重複');

      state.members.push(name);
      selectedSplitters.push(name);
      if (!state.custodian) state.custodian = name;
      input.value = '';
      syncState();
    }

    function removeMember(name) {
      if (!isAdmin) return;
      const inUse = state.expenses.some(e => e.payer === name || (e.splitWith && e.splitWith.includes(name)));
      if (inUse) return showToast(`「${name}」已有帳目，請先刪除花費紀錄`);

      state.members = state.members.filter(m => m !== name);
      selectedSplitters = selectedSplitters.filter(n => n !== name);
      if (state.custodian === name) state.custodian = state.members[0] || "";
      delete state.memberBanks[name];
      syncState();
    }

    function clearAllMembers() {
      if (!isAdmin) return;
      if (state.expenses.length > 0) return showToast('已有消費紀錄，請先清空花費');
      showConfirm('確定清空所有同行旅伴？', () => {
        state.members = [];
        state.custodian = "";
        state.memberBanks = {};
        selectedSplitters = [];
        syncState();
      });
    }

    // 6. 記錄支出 (自費、扣抵、分攤)
    // ==========================================

      if (area.style.display === 'none') {

      } else {

          <span style="font-size:11px; color:var(--text-muted);">元</span>

    function toggleSplitterAction(name) {

      if (idx !== -1) selectedSplitters.splice(idx, 1);

    function toggleAllSplitters() {

    function renderSplitButtons() {
      const c = document.getElementById('splitButtonsContainer');
      if (state.members.length === 0) {
        c.innerHTML = '<span style="font-size:11px; color:var(--text-light); grid-column:1/-1;">請先在上方加入旅伴</span>';

      }
      c.innerHTML = state.members.map(m => {
        const active = selectedSplitters.includes(m);
        return `
          <button type="button" class="split-chip ${active ? 'active' : ''}" onclick="toggleSplitterAction('${m}')">
            ${m}

    function clearExpenseForm() {
      document.getElementById('itemTitle').value = '';
      document.getElementById('itemAmount').value = '';
      document.getElementById('payerSelect').value = (state.kittyEnabled && state.custodian) ? state.custodian : (state.members[0] || '');
      customSplits = [];
      document.getElementById('customArea').style.display = 'none';
      document.getElementById('customToggleBtn').innerText = '＋ 新增自費';
      selectedSplitters = state.members.slice();
      renderSplitButtons();
      renderCustomList();
    }

    function addExpense() {
      if (!isAdmin) return;
      if (state.members.length === 0) return showToast('請先加入同行旅伴');

      const titleInput = document.getElementById('itemTitle');
      const amountInput = document.getElementById('itemAmount');
      const payerSelect = document.getElementById('payerSelect');

      const title = titleInput.value ? titleInput.value.trim() : '';
      const amount = parseFloat(amountInput.value);
      const payer = payerSelect.value;

      if (!title) return showToast('請填寫支出品項');
      if (isNaN(amount) || amount <= 0) return showToast('請輸入有效金額');
      if (!payer) return showToast('請選擇付款人');

      const customSum = customSplits.reduce((acc, c) => acc + (Number(c.amount) || 0), 0);
      if (customSum > amount) return showToast('自費總和不能大於支出金額');
      if (selectedSplitters.length === 0 && (amount - customSum) > 0) return showToast('請至少勾選一位分攤旅伴');

      let kittyDeduction = 0;
      let personalPaid = amount;

      if (state.kittyEnabled && payer === state.custodian) {
        const currentKitty = getKittyBalance();
        if (currentKitty > 0) {
          kittyDeduction = Math.min(amount, currentKitty);
          personalPaid = amount - kittyDeduction;
        }
      }

      state.expenses.push({
        id: String(Date.now()),
        title,
        amount,
        payer,
        kittyDeduction,
        personalPaid,
        customSplits: customSplits.filter(c => c.amount > 0),
        splitWith: selectedSplitters.slice()
      });

      clearExpenseForm();
      syncState();
    }

    function deleteExpense(id) {
      if (!isAdmin) return;
      state.expenses = state.expenses.filter(e => e.id !== String(id));
      syncState();
    }

    function clearAllExpenses() {
      if (!isAdmin) return;
      if (state.expenses.length === 0) return;
      showConfirm('確定清空所有花費紀錄？', () => {
        state.expenses = [];
        syncState();
      });
    }

    // ==========================================
    // 7. 收支統計與結算演算法
    // ==========================================
    function computeMemberStatistics() {
      const stats = {};
      state.members.forEach(m => {
        stats[m] = { totalSpent: 0, totalPaid: 0 };
      });

      state.expenses.forEach(exp => {
        if (stats[exp.payer]) {
          stats[exp.payer].totalPaid += (Number(exp.personalPaid) || 0);
        }

        let rest = exp.amount;
        if (Array.isArray(exp.customSplits)) {
          exp.customSplits.forEach(cs => {
            if (stats[cs.person]) {
              stats[cs.person].totalSpent += Number(cs.amount) || 0;
              rest -= Number(cs.amount) || 0;
            }
          });
        }

        if (Array.isArray(exp.splitWith) && exp.splitWith.length > 0 && rest > 0) {
          const splitUnit = rest / exp.splitWith.length;
          exp.splitWith.forEach(p => {
            if (stats[p]) stats[p].totalSpent += splitUnit;
          });
        }
      });

      return stats;
    }

    function computeSettlement() {
      const balance = {};
      state.members.forEach(m => balance[m] = 0);

      state.expenses.forEach(exp => {
        if (balance[exp.payer] !== undefined) {
          balance[exp.payer] += (Number(exp.personalPaid) || 0);
        }

        let rest = exp.amount;
        if (Array.isArray(exp.customSplits)) {
          exp.customSplits.forEach(cs => {
            if (balance[cs.person] !== undefined) {
              balance[cs.person] -= cs.amount;
              rest -= cs.amount;
            }
          });
        }

        if (Array.isArray(exp.splitWith) && exp.splitWith.length > 0 && rest > 0) {
          const splitAmt = rest / exp.splitWith.length;
          exp.splitWith.forEach(p => {
            if (balance[p] !== undefined) balance[p] -= splitAmt;
          });
        }
      });

      const kittyBal = getKittyBalance();
      if (state.kittyEnabled && state.members.length > 0 && kittyBal > 0) {
        const refundPerPerson = kittyBal / state.members.length;
        state.members.forEach(m => balance[m] += refundPerPerson);
        if (state.custodian && balance[state.custodian] !== undefined) {
          balance[state.custodian] -= kittyBal;
        }
      }

      const debtors = [];
      const creditors = [];
      for (const [person, net] of Object.entries(balance)) {
        const rounded = Math.round(net);
        if (rounded < -0.5) debtors.push({ person, amount: -rounded });
        else if (rounded > 0.5) creditors.push({ person, amount: rounded });
      }

      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const transactions = [];
      let i = 0, j = 0;
      const debtorsCopy = debtors.map(d => ({ ...d }));
      const creditorsCopy = creditors.map(c => ({ ...c }));

      while (i < debtorsCopy.length && j < creditorsCopy.length) {
        const d = debtorsCopy[i];
        const cr = creditorsCopy[j];
        const amt = Math.min(d.amount, cr.amount);

        transactions.push({ from: d.person, to: cr.person, amount: amt });
        d.amount -= amt;
        cr.amount -= amt;

        if (d.amount === 0) i++;
        if (cr.amount === 0) j++;
      }

      return { transactions, creditors, kittyLeftover: kittyBal };
    }

    function updateMemberBank(person, field, val) {
      if (!state.memberBanks[person]) state.memberBanks[person] = { code: "", account: "" };
      state.memberBanks[person][field] = val.trim();
      if (tripRef) {
        tripRef.child(`memberBanks/${person}/${field}`).set(val.trim());
      }
    }

    // ==========================================
    // 8. 畫面渲染
    // ==========================================
    function renderAll() {
      const inactiveBanner = document.getElementById('kittyInactiveBanner');
      const activeCard = document.getElementById('kittyActiveCard');

      if (state.kittyEnabled) {
        inactiveBanner.style.display = 'none';
        activeCard.style.display = 'block';
      } else {
        inactiveBanner.style.display = 'flex';
        activeCard.style.display = 'none';
      }

      const kittyBal = getKittyBalance();
      document.getElementById('kittyBalanceDisplay').innerText = `$${Math.round(kittyBal).toLocaleString()}`;

      // 保管人選單
      const cSelect = document.getElementById('custodianSelect');
      cSelect.innerHTML = `<option value="">未指定</option>` + state.members.map(m => 
        `<option value="${m}" ${state.custodian === m ? 'selected' : ''}>${m}</option>`
      ).join('');

      // 公基金紀錄抽屜
      const kLogs = document.getElementById('kittyDepositLogs');
      if (!state.kittyDeposits || state.kittyDeposits.length === 0) {
        kLogs.innerHTML = '<span style="opacity:0.75;">尚無公基金收款紀錄</span>';
      } else {
        kLogs.innerHTML = state.kittyDeposits.map(k => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:3px 0;">
            <span>${k.time} · ${k.payer} · $${k.totalAmount.toLocaleString()}</span>
            ${isAdmin ? `<button type="button" onclick="deleteKittyDeposit('${k.id}')" style="background:none; border:none; color:#BA7C7C; cursor:pointer;">&times;</button>` : ''}
          </div>
        `).join('');
      }

      // 旅伴收支小記
      const stats = computeMemberStatistics();
      const statsBox = document.getElementById('memberStatsContainer');
      if (state.members.length === 0) {
        statsBox.innerHTML = '<p class="empty-hint">尚未加入同行旅伴</p>';
      } else {
        statsBox.innerHTML = state.members.map(m => {
          const item = stats[m] || { totalSpent: 0, totalPaid: 0 };
          return `
            <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-warm); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:7px 10px; font-size:12px;">
              <div>
                <span style="font-weight:500;">${m}</span>
                ${(state.kittyEnabled && m === state.custodian) ? '<span style="font-size:10px; background:var(--theme-light); color:var(--theme-dark); padding:1px 5px; border-radius:3px; margin-left:4px;">總務</span>' : ''}
              </div>
              <div style="display:flex; gap:10px; font-size:11px; font-family:monospace;">
                <span style="color:var(--text-muted);">花費 $${Math.round(item.totalSpent).toLocaleString()}</span>
                <span style="color:var(--theme-dark); font-weight:600;">代墊 $${Math.round(item.totalPaid).toLocaleString()}</span>
              </div>
            </div>
          `;
        }).join('');
      }

      // 成員網格名單
      document.getElementById('memberCountBadge').innerText = state.members.length;
      const mContainer = document.getElementById('membersContainer');
      mContainer.innerHTML = state.members.map(m => `
        <span class="member-chip">
          <span>${m}</span>
          ${isAdmin ? `<button type="button" class="chip-del" onclick="removeMember('${m}')">&times;</button>` : ''}
        </span>
      `).join('') || '<span class="empty-hint" style="grid-column:1/-1; padding:4px 0;">尚未加入任何旅伴</span>';

      // 付款人下拉選單
      const pSelect = document.getElementById('payerSelect');
      const curPayer = pSelect.value;
      pSelect.innerHTML = state.members.map(m => {
        const isCustodian = state.kittyEnabled && m === state.custodian;
        return `<option value="${m}" ${(curPayer === m || (!curPayer && isCustodian)) ? 'selected' : ''}>${m}${isCustodian ? ' (公基金優先扣抵)' : ''}</option>`;
      }).join('');

      renderSplitButtons();
      renderCustomList();

      // 消費清單
      const expList = document.getElementById('expenseList');
      let total = 0;
      if (state.expenses.length === 0) {
        expList.innerHTML = '<p class="empty-hint">尚無花費紀錄</p>';
      } else {
        expList.innerHTML = state.expenses.slice().reverse().map(e => {
          total += Number(e.amount) || 0;
          const isExpanded = expandedExpenseId === e.id;
          const hasKitty = e.kittyDeduction > 0;

          return `
            <div class="expense-item">
              <div class="expense-main-row">
                <div>
                  <span style="font-weight:500;">${e.title}</span>
                  <span style="color:var(--theme-dark); font-weight:600; font-family:monospace; margin-left:4px;">$${Math.round(e.amount).toLocaleString()}</span>
                </div>
                <div style="display:flex; align-items:center;">
                  <button type="button" onclick="toggleExpandExpense('${e.id}')" style="background:none; border:none; color:var(--theme-dark); font-size:11px; cursor:pointer;">
                    ${isExpanded ? '收合 ▴' : '明細 ▾'}
                  </button>
                  ${isAdmin ? `<button type="button" class="btn-del-expense" onclick="deleteExpense('${e.id}')">刪除</button>` : ''}
                </div>
              </div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">
                ${e.payer} 付 · ${(e.splitWith || []).length} 人分攤
                ${hasKitty ? ` · <span style="color:var(--theme-dark);">(公基金扣抵 $${Math.round(e.kittyDeduction).toLocaleString()}${e.personalPaid > 0 ? ` + 個人代墊 $${Math.round(e.personalPaid).toLocaleString()}` : ''})</span>` : ''}
              </div>
              ${isExpanded ? `
                <div class="expense-detail-drawer">
                  <div style="margin-bottom:3px;"><strong>分攤旅伴：</strong>${(e.splitWith || []).join('、 ')}</div>
                  ${(e.customSplits && e.customSplits.length) ? `<div><strong>特定自費：</strong>${e.customSplits.map(c=>`${c.person}$${c.amount}`).join('、 ')}</div>` : ''}
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      }
      document.getElementById('totalCostDisplay').innerText = `累計：$${Math.round(total).toLocaleString()}`;

      // 結算列表
      const setList = document.getElementById('settlementList');
      const { transactions, creditors } = computeSettlement();
      if (transactions.length === 0) {
        setList.innerHTML = '<p class="empty-hint">目前帳目已平衡，無須轉帳</p>';
      } else {
        setList.innerHTML = transactions.map(t => `
          <div class="settle-card">
            <span style="font-size:12px;"><strong>${t.from}</strong> ➔ 應轉給 <strong>${t.to}</strong></span>
            <span class="settle-amount">$${t.amount.toLocaleString()}</span>
          </div>
        `).join('');
      }

      // 收款帳號列表
      const accList = document.getElementById('accountList');
      if (creditors.length === 0) {
        accList.innerHTML = '<span style="font-size:11px; color:var(--text-light);">尚無收款需求</span>';
      } else {
        accList.innerHTML = creditors.map(c => {
          const bankData = state.memberBanks[c.person] || { code: "", account: "" };
          return `
            <div class="account-card">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px; font-weight:600;">${c.person}</span>
                <span style="font-size:11px; color:var(--theme-dark); font-weight:600;">應收：$${c.amount.toLocaleString()}</span>
              </div>
              <div class="account-row">
                <input type="text" maxlength="3" class="bank-code-input" placeholder="代碼" value="${bankData.code || ''}" 
                       onchange="updateMemberBank('${c.person}', 'code', this.value)">
                <input type="text" class="bank-account-input" placeholder="帳號" value="${bankData.account || ''}" 
                       onchange="updateMemberBank('${c.person}', 'account', this.value)">
                <button type="button" class="btn-copy-sm" onclick="copyPureAccount('${bankData.account}', '${c.person}')">複製</button>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    function toggleExpandExpense(id) {
      expandedExpenseId = (expandedExpenseId === id) ? null : id;
      renderAll();
    }

    function copyPureAccount(acc, name) {
      if (!acc) return showToast(`請先填寫 ${name} 的帳號`);
      copyToClipboard(acc.replace(/[^0-9]/g, ''), `已複製 ${name} 的帳號`);
    }

    function copyToClipboard(txt, msg) {
      if (!txt) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => {
          showToast(msg || '已複製');
        }).catch(() => fallbackCopy(txt, msg));
      } else {
        fallbackCopy(txt, msg);
      }
    }

    function fallbackCopy(txt, msg) {
      const input = document.createElement('textarea');
      input.value = txt;
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      try {
        document.execCommand('copy');
        showToast(msg || '已複製');
      } catch (err) {
        showToast('複製失敗，請手動複製');
      }
      document.body.removeChild(input);
    }

    function copySettlementSummary() {
      const { transactions, creditors, kittyLeftover } = computeSettlement();
      if (transactions.length === 0) return showToast('目前無須轉帳');

      let out = '🌾【旅途結算清單】\n';
      transactions.forEach(t => {
        out += `👉 ${t.from} 應轉給 ${t.to}：$${t.amount.toLocaleString()} 元\n`;
      });

      if (state.kittyEnabled && kittyLeftover > 0 && state.custodian) {
        out += `\n💡 備註：公基金剩餘現鈔 $${Math.round(kittyLeftover).toLocaleString()} 已由總務【${state.custodian}】直接抵銷。\n`;
      }

      out += '\n【收款人帳號】\n';
      creditors.forEach(c => {
        const b = state.memberBanks[c.person] || { code: "", account: "" };
        out += `🏦 ${c.person}：銀行代碼 ${b.code || '未填'} 帳號 ${b.account || '未填'}\n`;
      });

      copyToClipboard(out, '已複製結算清單，可直接貼至 LINE 群組！');
    }

    function resetEntireTrip() {
      if (!isAdmin) return;
      showConfirm('確定要清空這趟旅程的所有紀錄（人員、公基金、花費）嗎？', () => {
        state.members = [];
        state.custodian = "";
        state.memberBanks = {};
        state.kittyDeposits = [];
        state.expenses = [];
        state.kittyEnabled = false;
        selectedSplitters = [];
        customSplits = [];
        syncState();
      });
    }

    // 啟動初始化
    initDataSync();
  </script>
</body>
</html>
